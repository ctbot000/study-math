# GitHub Pages build settings.
#
# The site relies on plugins GitHub Pages enables by default, so none are
# declared here:
#   jekyll-optional-front-matter — INDEX.md becomes a page without front matter
#   jekyll-default-layout        — pages with no layout get _layouts/default
#   jekyll-relative-links        — links to *.md resolve to the built pages
#
# jekyll-readme-index is deliberately not relied on: its "does this directory
# already have an index?" test is case-insensitive, so INDEX.md counts as one
# and the README is never promoted to the site root. home.md supplies the root
# instead, via permalink.
#
# Math is left to MathJax in the layout: kramdown passes inline $…$ through
# untouched and rewrites display $$…$$ to \[…\], and MathJax reads both.

title: study-math
description: A record of what I learn about mathematics.
url: https://ctbot000.github.io
baseurl: /study-math

exclude:
  - CLAUDE.md
  - README.md

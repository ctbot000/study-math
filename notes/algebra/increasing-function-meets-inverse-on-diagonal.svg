<svg xmlns="http://www.w3.org/2000/svg" width="680" height="494" viewBox="0 0 680 494" role="img">
<title>Increasing vs decreasing: where f meets its inverse</title>
<desc>Left: f(x) = x³ and its inverse, the cube root, meet only on y = x, at −1, 0 and 1. Right: f(x) = −x³ and its inverse also meet at (1, −1) and (−1, 1), a mirror pair off y = x joined by a chord of slope −1.</desc>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; }
  }
  .bg { fill: var(--bg); }
  .t, .ts { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Helvetica, Arial, sans-serif; }
  .t { fill: var(--fg); font-size: 14px; }
  .ts { fill: var(--muted); font-size: 12px; }
</style>

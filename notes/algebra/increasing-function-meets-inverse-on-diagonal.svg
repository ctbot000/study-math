<rect class="bg" x="0" y="0" width="680" height="494"/>
<text class="t" x="180.0" y="32" text-anchor="middle">increasing: f(x) = x³</text>
<text class="t" x="500.0" y="32" text-anchor="middle">decreasing: f(x) = −x³</text>

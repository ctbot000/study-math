<svg xmlns="http://www.w3.org/2000/svg" width="680" height="534" viewBox="0 0 680 534" role="img">
<title>Phantom roots of an absolute-value equation</title>
<desc>y = |x − 1| with both branches extended as dashed lines, and the line y = 2x. The line meets the V only at x = 1/3; it meets the dashed extension of the right branch at x = −1, the root the case x ≥ 1 produces and must reject.</desc>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; }
  }
  .bg { fill: var(--bg); }
  .t, .ts { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Helvetica, Arial, sans-serif; }
  .t { fill: var(--fg); font-size: 14px; }
  .ts { fill: var(--muted); font-size: 12px; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><clipPath id="plot"><rect x="100" y="40" width="480" height="360"/></clipPath></defs>
<rect class="bg" x="0" y="0" width="680" height="534"/>
<line x1="90.0" y1="220.0" x2="592.0" y2="220.0" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="313.3" y1="410.0" x2="313.3" y2="30.0" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line clip-path="url(#plot)" x1="100.0" y1="400.0" x2="420.0" y2="220.0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 5"/>
<line clip-path="url(#plot)" x1="420.0" y1="220.0" x2="580.0" y2="310.0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 5"/>
<polyline clip-path="url(#plot)" points="100.0,40.0 420.0,220.0 580.0,130.0" fill="none" stroke="#D85A30" stroke-width="2.5"/>
<line clip-path="url(#plot)" x1="153.3" y1="400.0" x2="473.3" y2="40.0" stroke="#1D9E75" stroke-width="2.5"/>
<line clip-path="url(#plot)" x1="348.9" y1="180.0" x2="348.9" y2="220.0" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="3 3"/>
<line clip-path="url(#plot)" x1="206.7" y1="340.0" x2="206.7" y2="220.0" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="348.9" cy="180.0" r="5" fill="#7F77DD"/>
<circle class="bg" cx="206.7" cy="340.0" r="5" stroke="#7F77DD" stroke-width="1.5"/>
<text class="ts" x="348.9" y="238.0" text-anchor="middle">1/3</text>
<text class="ts" x="206.7" y="210.0" text-anchor="middle">−1</text>
<text class="ts" x="420.0" y="240.0" text-anchor="middle">1</text>
<text class="ts" x="304.0" y="212.0" text-anchor="end">O</text>
<line x1="80.0" y1="436.0" x2="110.0" y2="436.0" stroke="#D85A30" stroke-width="2.5"/>
<text class="t" x="120.0" y="440.0">y = |x − 1|</text>
<line x1="80.0" y1="460.0" x2="110.0" y2="460.0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="t" x="120.0" y="464.0">its branches extended: each case solves against a whole line</text>
<line x1="80.0" y1="484.0" x2="110.0" y2="484.0" stroke="#1D9E75" stroke-width="2.5"/>
<text class="t" x="120.0" y="488.0">y = 2x</text>
<circle cx="86.0" cy="508.0" r="4.5" fill="#7F77DD"/>
<circle class="bg" cx="102.0" cy="508.0" r="4.5" stroke="#7F77DD" stroke-width="1.5"/>
<text class="t" x="120.0" y="512.0">kept: x = 1/3 · rejected: x = −1, from the case x ≥ 1</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" role="img">
<title>A gap in the range filled backwards</title>
<desc>The outer pieces y = x for x ≤ 0 and x ≥ 1 leave the heights between 0 and 1 unused. The middle piece y = 1 − x covers that gap backwards; y = x would cover it forwards. Both make f a bijection.</desc>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --band: #F1EFE8; --band-line: #B4B2A9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --band: #2C2C2A; --band-line: #5F5E5A; }
  }
  .bg { fill: var(--bg); }
  .band { fill: var(--band); stroke: var(--band-line); stroke-width: 0.5; }
  .t, .ts { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Helvetica, Arial, sans-serif; }
  .t { fill: var(--fg); font-size: 14px; }
  .ts { fill: var(--muted); font-size: 12px; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="552"/>
<rect class="band" x="120" y="170" width="510" height="130"/>
<text class="ts" x="620" y="240" text-anchor="end">gap: 0 &lt; y &lt; 1</text>
<line x1="110" y1="300" x2="642" y2="300" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="315" y1="440" x2="315" y2="28" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="322" y="316">O</text>
<text class="ts" x="445" y="318" text-anchor="middle">1</text>
<text class="ts" x="305" y="174" text-anchor="end">1</text>
<line x1="315" y1="300" x2="445" y2="170" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="315" y1="170" x2="445" y2="300" stroke="#D85A30" stroke-width="2.5"/>
<line x1="185" y1="430" x2="315" y2="300" stroke="#888780" stroke-width="2.5" marker-start="url(#arrow)"/>
<line x1="445" y1="170" x2="575" y2="40" stroke="#888780" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="315" cy="300" r="4.5" fill="#888780"/>
<circle cx="445" cy="170" r="4.5" fill="#888780"/>
<circle class="bg" cx="315" cy="170" r="4.5" stroke="#D85A30" stroke-width="1.5"/>
<circle class="bg" cx="445" cy="300" r="4.5" stroke="#D85A30" stroke-width="1.5"/>
<line x1="80" y1="476" x2="110" y2="476" stroke="#888780" stroke-width="2.5"/>
<text class="t" x="120" y="480">outer pieces y = x leave the gap 0 &lt; y &lt; 1</text>
<line x1="80" y1="500" x2="110" y2="500" stroke="#D85A30" stroke-width="2.5"/>
<text class="t" x="120" y="504">filler running backwards: y = 1 − x</text>
<line x1="80" y1="524" x2="110" y2="524" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="t" x="120" y="528">filler running forwards: y = x, which works too</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="668" viewBox="0 0 680 668" role="img">
<title>Mirror pairs on perpendicular lines</title>
<desc>The curve y = √x for x ≥ 0 and y = −x² for x &lt; 0 is symmetric about the line y = −x. The line y = x + 3/16, perpendicular to that axis, meets it in four points forming two mirror pairs; the line y = x meets it in three points, because one of them, the origin, lies on the axis.</desc>
